# ============================================================
# Smart College Notes - Spring Boot Configuration
# ============================================================

# Application
spring.application.name=smart-college-notes
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_college_notes?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# File Upload Multipart Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Local PDF Upload Storage Directory
app.upload.dir=${UPLOAD_DIR:uploads/notes}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your_jwt_secret_key_must_be_at_least_256_bits_long_here}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google Gemini AI Configuration
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# CORS Configuration
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
