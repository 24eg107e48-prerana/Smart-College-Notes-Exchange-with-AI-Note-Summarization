# Application & Server Port (Render injects PORT, fallback to SERVER_PORT or 8080)
spring.application.name=smart-college-notes
server.port=${PORT:${SERVER_PORT:8080}}

# MySQL Database Configuration (Configured with Clever Cloud default, overrideable via DB_URL)
spring.datasource.url=${DB_URL:jdbc:mysql://b6vgzugqmgx1d4qjld8w-mysql.services.clever-cloud.com:3306/b6vgzugqmgx1d4qjld8w?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:uvl6epe395e88swu}
spring.datasource.password=${DB_PASSWORD:8RZZEuQrIAlmDCPHBWNT}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
