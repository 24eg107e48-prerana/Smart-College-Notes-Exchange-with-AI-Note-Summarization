# Local PDF Upload Storage Directory
app.upload.dir=${UPLOAD_DIR:uploads/notes}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your_jwt_secret_key_must_be_at_least_256_bits_long_here}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google Gemini AI Configuration (Called exclusively on the backend)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# CORS Configuration (Comma-separated list of allowed origins or patterns for Netlify frontend)
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.netlify.app}