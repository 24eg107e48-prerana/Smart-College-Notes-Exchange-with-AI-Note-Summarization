# ============================================================
# Netlify Configuration - Smart College Notes Exchange
# ============================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Single-Page Application (SPA) redirect rule for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers for static production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
